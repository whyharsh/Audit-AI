<text x="432" y="651" font-size="20" style="fill:#bf7039" class="label">PREVIEW → EXECUTE</text>
<text x="432" y="686" font-size="26" style="fill:#24364b" class="sketch">Review it, then run it</text>
<text x="432" y="718" font-size="20" style="fill:#24364b" class="body">Inspect the query specification.</text>
<text x="432" y="743" font-size="20" style="fill:#24364b" class="body">Execute against the dataset.</text>
