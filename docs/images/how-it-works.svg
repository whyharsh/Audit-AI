<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1110" viewBox="0 0 1120 1110" role="img" aria-labelledby="title desc">
<title id="title">How Audit AI works</title>
<desc id="desc">Synthetic Tally files are parsed into facts with provenance and a transaction graph. Five deterministic controls produce reproducible findings. Auditor questions pass through a local or optional AI compiler, a query preview, and deterministic execution against the same graph. Findings and exploration results lead into an evidence workspace where auditors inspect transactions and source excerpts.</desc>
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#d8d8d0" opacity="0.55"/></pattern></defs>
<rect width="1120" height="1110" rx="24" fill="#faf9f5"/>
<rect x="18" y="18" width="1084" height="1074" rx="16" fill="url(#dots)"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#24364b}.sketch{font-family:'Chalkboard SE','Segoe Print','Comic Sans MS',cursive}.body{font-size:19px;fill:#63738a}.label{font-size:13px;font-weight:700;letter-spacing:2px}</style>
<text x="54" y="55" font-size="20" style="fill:#377aaf" class="label">AUDIT AI / UNDER THE HOOD</text>
<text x="52" y="108" font-size="43" style="fill:#24364b" class="sketch">From records to reasons.</text>
<text x="54" y="143" font-size="21" style="fill:#63738a">AI translates the question. The engine evaluates the evidence.</text>
<rect x="57" y="197" width="300" height="142" rx="15" fill="#377aaf" opacity="0.07"/>
