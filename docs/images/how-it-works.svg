<text x="432" y="429" font-size="20" style="fill:#bf7039" class="label">QUESTION COMPILER</text>
<text x="432" y="464" font-size="26" style="fill:#24364b" class="sketch">Translate into a query</text>
<text x="432" y="496" font-size="20" style="fill:#24364b" class="body">Local patterns or an optional</text>
<text x="432" y="521" font-size="20" style="fill:#24364b" class="body">AI compiler → supported spec.</text>
