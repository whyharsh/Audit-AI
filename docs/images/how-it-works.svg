<text x="788" y="651" font-size="20" style="fill:#377aaf" class="label">05 / REPRODUCIBLE OUTPUT</text>
<text x="788" y="686" font-size="26" style="fill:#24364b" class="sketch">Inspect the findings</text>
<text x="788" y="718" font-size="20" style="fill:#24364b" class="body">Stable IDs, source references,</text>
<text x="788" y="743" font-size="20" style="fill:#24364b" class="body">and repeatable results.</text>
