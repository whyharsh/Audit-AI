<text x="1068" y="581" font-size="15" style="fill:#377aaf" text-anchor="end">same graph</text>
<text x="66" y="660" font-size="23" style="fill:#bf7039" class="sketch">A bounded role for AI</text>
<text x="66" y="693" font-size="18" style="fill:#63738a">It proposes a query;</text>
<text x="66" y="719" font-size="18" style="fill:#63738a">the deterministic engine</text>
<text x="66" y="745" font-size="18" style="fill:#63738a">computes the result.</text>
