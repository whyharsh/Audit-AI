<text x="788" y="429" font-size="20" style="fill:#377aaf" class="label">04 / CONTROL ENGINE</text>
<text x="788" y="464" font-size="26" style="fill:#24364b" class="sketch">Run five controls</text>
<text x="788" y="496" font-size="20" style="fill:#24364b" class="body">Duplicates, cutoff, edit logs,</text>
<text x="788" y="521" font-size="20" style="fill:#24364b" class="body">and manual-journal risk.</text>
