<text x="788" y="221" font-size="20" style="fill:#377aaf" class="label">03 / SHARED DATASET</text>
<text x="788" y="256" font-size="26" style="fill:#24364b" class="sketch">Build the graph</text>
<text x="788" y="288" font-size="20" style="fill:#24364b" class="body">Connect vouchers, parties,</text>
<text x="788" y="313" font-size="20" style="fill:#24364b" class="body">accounts, and documents.</text>
