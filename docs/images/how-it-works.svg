<text x="432" y="221" font-size="20" style="fill:#377aaf" class="label">02 / INGESTION</text>
<text x="432" y="256" font-size="26" style="fill:#24364b" class="sketch">Attach provenance</text>
<text x="432" y="288" font-size="20" style="fill:#24364b" class="body">Parse facts, hash artifacts,</text>
<text x="432" y="313" font-size="20" style="fill:#24364b" class="body">and record provenance.</text>
<rect x="769" y="197" width="300" height="142" rx="15" fill="#377aaf" opacity="0.07"/>
<path d="M 778,193 Q 916.0,190 1055,193 Q 1067,192 1066,205 L 1065,322 Q 1066,335 1053,334 L 778,333 Q 765,334 766,322 L 767,204 Q 766,192 778,193 Z" fill="#edf4fb" stroke="#377aaf" stroke-width="1.8"/>
