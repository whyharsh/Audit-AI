<text x="76" y="429" font-size="20" style="fill:#bf7039" class="label">EXPLORATION / AUDITOR INPUT</text>
<text x="76" y="464" font-size="26" style="fill:#24364b" class="sketch">Ask a question</text>
<text x="76" y="496" font-size="20" style="fill:#24364b" class="body">“Show duplicate payments”</text>
<text x="76" y="521" font-size="20" style="fill:#24364b" class="body">“Show round sum journals”</text>
