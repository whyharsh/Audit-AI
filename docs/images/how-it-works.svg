<text x="76" y="221" font-size="20" style="fill:#377aaf" class="label">01 / SOURCE MATERIAL</text>
<text x="76" y="256" font-size="26" style="fill:#24364b" class="sketch">Start with records</text>
<text x="76" y="288" font-size="20" style="fill:#24364b" class="body">Synthetic Tally XML, edit log,</text>
<text x="76" y="313" font-size="20" style="fill:#24364b" class="body">and document metadata</text>
<rect x="413" y="197" width="300" height="142" rx="15" fill="#377aaf" opacity="0.07"/>
<path d="M 422,193 Q 560.0,190 699,193 Q 711,192 710,205 L 709,322 Q 710,335 697,334 L 422,333 Q 409,334 410,322 L 411,204 Q 410,192 422,193 Z" fill="#edf4fb" stroke="#377aaf" stroke-width="1.8"/>
